#@TYPE: Machine
#@NAME: txmp-2570
#@DESCRIPTION: Machine Configuration for Ka-Ro electronics GmbH's TXMP-2570 CoM

MACHINEOVERRIDES =. "stm32mp25common:stm32mp25:txmp:"

require include/stm32mp2-base.inc
require include/stm32mp25-overlays.inc

SOC_PREFIX = "stm32mp25"
SOC_FAMILY = "stm32mp257f"

MACHINE_FEATURES:append = " stm-tsn-swch"

# =========================================================================
# U-Boot configs
# =========================================================================
UBOOT_CONFIG[optee] = "txmp-2570_optee_defconfig"
UBOOT_CONFIG[trusted] = "txmp-2570_trusted_defconfig"
UBOOT_CONFIG[noenv] = "txmp-2570_noenv_defconfig"
UBOOT_CONFIG[mfg] = "txmp-2570_mfg_defconfig"
