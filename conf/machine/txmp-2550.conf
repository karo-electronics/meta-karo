#@TYPE: Machine
#@NAME: txmp-2550
#@DESCRIPTION: Machine Configuration for Ka-Ro electronics GmbH's TXMP-2550 CoM

MACHINEOVERRIDES =. "txmp:"

require include/stm32mp2-base.inc

SOC_PREFIX = "stm32mp25"
SOC_FAMILY = "stm32mp257f"

# =========================================================================
# U-Boot configs
# =========================================================================
UBOOT_CONFIG[optee] = "txmp-2550_optee_defconfig"
UBOOT_CONFIG[trusted] = "txmp-2550_trusted_defconfig"
UBOOT_CONFIG[noenv] = "txmp-2550_noenv_defconfig"
UBOOT_CONFIG[mfg] = "txmp-2550_mfg_defconfig"

BOOTDEVICE_LABELS ?= "emmc"

# Trusted Firmware
TF_A_DEVICETREE ?= "stm32mp257f-txmp-2550"

# Kernel
KERNEL_DEVICETREE ?= "st/stm32mp257f-txmp-2550.dtb"
