#@TYPE: Machine
#@NAME: qsmp-2350
#@DESCRIPTION: Machine Configuration for Ka-Ro electronics GmbH's QSMP-2350 CoM

MACHINEOVERRIDES =. "stm32mp23common:stm32mp23:qsmp:"

MACHINE_FEATURES:append = " lvds"

require include/stm32mp2-base.inc
require include/stm32mp23-overlays.inc

SOC_PREFIX = "stm32mp23"
SOC_FAMILY = "stm32mp235c"

KARO_BOARD_PMIC ?= "pca9450"

# =========================================================================
# U-Boot configs
# =========================================================================
UBOOT_CONFIG[optee] = "qsmp-2350_optee_defconfig"
UBOOT_CONFIG[trusted] = "qsmp-2350_trusted_defconfig"
UBOOT_CONFIG[noenv] = "qsmp-2350_noenv_defconfig"
UBOOT_CONFIG[mfg] = "qsmp-2350_mfg_defconfig"

SERIAL_CONSOLES ?= "115200;ttySTM0 \
        ${@ "115200;ttySTM1" if d.getVar('KARO_BASEBOARD') != "qsbase5" else ""} \
        115200;ttySTM2 \
"

NETWORK_INTERFACES ?= "eth0 \
        ${@ "eth1" if d.getVar('KARO_BASEBOARD') == "qsbase5" else ""} \
"
