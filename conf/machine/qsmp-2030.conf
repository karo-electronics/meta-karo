#@TYPE: Machine
#@NAME: qsmp-2030
#@DESCRIPTION: Machine Configuration for Ka-Ro electronics GmbH's QSMP-2030 CoM

MACHINEOVERRIDES =. "stm32mp23common:stm32mp23:qsmp:qsmp20:"

#MACHINE_FEATURES:append = " lvds"

require include/stm32mp2-base.inc

SOC_PREFIX = "stm32mp23"
SOC_FAMILY = "stm32mp235c"

KARO_BOARD_PMIC ?= "pca9450"

# =========================================================================
# U-Boot configs
# =========================================================================
UBOOT_CONFIG[optee] = "qsmp-2030_optee_defconfig"
UBOOT_CONFIG[trusted] = "qsmp-2030_trusted_defconfig"
UBOOT_CONFIG[noenv] = "qsmp-2030_noenv_defconfig"
UBOOT_CONFIG[mfg] = "qsmp-2030_mfg_defconfig"

BOOTDEVICE_LABELS ?= "emmc"

# Trusted Firmware
TF_A_DEVICETREE ?= "stm32mp235c-qsmp-2030"

SERIAL_CONSOLES ?= "115200;ttySTM0 \
                115200;ttySTM2 \
"
NETWORK_INTERFACES ?= "eth0 \
        ${@ "eth1" if d.getVar('KARO_BASEBOARD') == "qsbase5" else ""} \
"

# Kernel
KERNEL_DEVICETREE ?= "st/stm32mp235c-qsmp-2030.dtb"

TF_A_DDR_TARGET ?= "ddr3"
