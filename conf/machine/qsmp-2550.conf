#@TYPE: Machine
#@NAME: qsmp-2550
#@DESCRIPTION: Machine Configuration for Ka-Ro electronics GmbH's QSMP-2550 CoM

MACHINEOVERRIDES =. "qsmp:"

MACHINE_FEATURES:append = " lvds"

require include/stm32mp2-base.inc

SOC_PREFIX = "stm32mp25"
SOC_FAMILY = "stm32mp255f"

KARO_BOARD_PMIC ?= "pca9450"

# =========================================================================
# U-Boot configs
# =========================================================================
UBOOT_CONFIG[optee] = "qsmp-2550_optee_defconfig"
UBOOT_CONFIG[trusted] = "qsmp-2550_trusted_defconfig"
UBOOT_CONFIG[noenv] = "qsmp-2550_noenv_defconfig"
UBOOT_CONFIG[mfg] = "qsmp-2550_mfg_defconfig"

BOOTDEVICE_LABELS ?= "emmc"

# Trusted Firmware
TF_A_DEVICETREE ?= "stm32mp255f-qsmp-2550"

SERIAL_CONSOLES ?= "115200;ttySTM0 \
        ${@ "115200;ttySTM1" if d.getVar('KARO_BASEBOARD') != "qsbase5" else ""} \
        115200;ttySTM2 \
"
NETWORK_INTERFACES ?= "eth0 \
        ${@ "eth1" if d.getVar('KARO_BASEBOARD') == "qsbase5" else ""} \
"

# Kernel
KERNEL_DEVICETREE ?= "st/stm32mp255f-qsmp-2550.dtb"
